[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "structured-eval"
version = "0.2.0"
description = "The LLM Structured Output Evaluation Framework"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
keywords = [
    "structured llm evaluation",
    "structured eval",
    "json eval",
    "llm",
    "structured output",
    "pydantic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5.0",
]

[project.urls]
Homepage = "https://github.com/kirillpechurin/structured-eval"
Repository = "https://github.com/kirillpechurin/structured-eval"
Issues = "https://github.com/kirillpechurin/structured-eval/issues"

[tool.setuptools.packages.find]
include = ["structured_eval*"]

[tool.setuptools.package-data]
structured_eval = ["py.typed"]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0.1"]
fuzzy = ["rapidfuzz>=3.0.0"]
jsonschema = ["jsonschema>=4.20.0"]
rules = ["jsonpath-ng>=1.6.0"]
diff = ["deepdiff>=7.0.0"]
align = ["scipy>=1.13.0"]
litellm = ["litellm>=1.58.0"]
deepeval = ["deepeval>=3.0.0"]
langsmith = ["langsmith>=0.8.0"]
# Every capability of structured-eval itself.
# The host-framework adapters (deepeval / langsmith) are deliberately *not* here.
all = [
    "structured-eval[yaml,fuzzy,jsonschema,rules,diff,align,litellm]"
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=4.6.0",
    "pyyaml>=6.0.1",
    "rapidfuzz>=3.0.0",
    "types-pyyaml>=6.0",
    "jsonschema>=4.20.0",
    "types-jsonschema>=4.20.0.20260518",
    "jsonpath-ng>=1.6",
    "deepdiff>=7.0.0",
    "scipy>=1.13.0",
    "scipy-stubs>=1.13.0",
    "litellm>=1.58.0",
    # Host-framework adapters, needed here so tests/integration/ runs instead of skipping.
    "deepeval>=3.0.0",
    "langsmith>=0.8.0",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Preview is on *only* to reach the three pydoclint rules below. Without
# `explicit-preview-rules` it would also turn on every other preview rule in the
# selected families — RUF069 alone fires 152 times on legitimate `score == 1.0`
# comparisons. With it, only preview rules selected by exact code are enforced.
preview = true
explicit-preview-rules = true
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear (real bugs + antipatterns)
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific (incl. RUF100 unused-noqa)
    "TCH",    # flake8-type-checking (TYPE_CHECKING blocks)
    "PTH",    # flake8-use-pathlib
    "T20",    # flake8-print (no print() in library code)
    "PT",     # flake8-pytest-style
    "PERF",   # performance anti-patterns
    "D",      # pydocstyle (Google convention, see [tool.ruff.lint.pydocstyle])
    "DOC201", # pydoclint: docstring omits a documented return value
    "DOC402", # pydoclint: generator docstring omits Yields
    "DOC501", # pydoclint: docstring omits a raised exception
    "PLR1714",
    "PLW2901", # select only non-noisy Pylint rules
]
ignore = [
    "E501",    # line too long (formatter handles it)
    "PLC0415", # import-not-at-top-level — intentional lazy imports behind extras
    "TRY003",  # raise-vanilla-args — style preference
    "PLR2004", # magic-value-comparison — numeric values are semantic here
    "RUF002",
    "RUF003",  # ambiguous unicode in docstrings/comments (Russian text ok)
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pydoclint]
# Google allows omitting `Returns:` when the summary already describes the
# return value. A one-line docstring is exactly that case, and this codebase
# leans on it heavily, so don't demand a section that would only restate it.
ignore-one-line-docstrings = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ARG",     # unused args common in fixtures/parametrize
    "PLR2004", # magic numbers in test assertions are fine
    # A test's name plus its `parametrize` ids are the documentation; Google's
    # own guide says to omit trivial test docstrings. `D100`/`D104` stay on —
    # every test module and package still states what unit it covers.
    "D101",
    "D102",
    "D103",
    "D107",
]

# ── Docstring migration (Google style) ────────────────────────────────────────
# Temporary. One line per layer; a layer's line is deleted by the PR that brings
# that layer to the convention, so the remaining lines are the todo list. When
# the last one goes, `D`/`DOC` are strict across the package.
#
# Module, package and class docstrings are done everywhere — what is left per
# layer is the function/method level: D102 (public method), D103 (public
# function), D105 (magic method), D107 (__init__) and the DOC section checks.
"structured_eval/*.py" = ["D102", "D103", "D105", "D107", "DOC"]
"structured_eval/alignment/**" = ["D102", "D103", "D105", "D107", "DOC"]
"structured_eval/engine/**" = ["D102", "D103", "D105", "D107", "DOC"]
"structured_eval/formats/**" = ["D102", "D103", "D105", "D107", "DOC"]
"structured_eval/integrations/**" = ["D102", "D103", "D105", "D107", "DOC"]
"structured_eval/llm/**" = ["D102", "D103", "D105", "D107", "DOC"]
"structured_eval/metrics/**" = ["D102", "D103", "D105", "D107", "DOC"]
"structured_eval/reporting/**" = ["D102", "D103", "D105", "D107", "DOC"]
"structured_eval/utils/**" = ["D102", "D103", "D105", "D107", "DOC"]
# Tests are converted last, and only these codes apply to them (the rest are
# waived permanently in the "tests/**" block above).
"tests/**/*" = ["D100", "D104", "D205", "D209", "DOC"]

# ── Mypy ──────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
warn_unreachable = true

# Optional third-party deps without type stubs (lazy-imported behind extras).
[[tool.mypy.overrides]]
module = [
    "jsonpath_ng.*",
    "deepeval.*",
    "langsmith.*",
    "deepdiff.*",
    "rapidfuzz.*",
    "litellm.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# Optional host-framework adapters subclass/call third-party types that are
# `Any` when the extra isn't installed (deepeval/langsmith). Relax just these
# two rules so the strict run is clean whether or not the extra is present.
[[tool.mypy.overrides]]
module = ["structured_eval.integrations.*"]
disallow_subclassing_any = false
disallow_untyped_calls = false

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
markers = [
    "unit: pure unit tests (single module, no engine)",
    "engine: end-to-end through the Evaluator",
    "integration: real third-party libraries (deepeval/langsmith/litellm)",
    "golden: regression on dataset fixtures",
    "property: invariant / metamorphic tests over generated inputs",
]

# ── Coverage ──────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["structured_eval"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 98
omit = ["structured_eval/integrations/*"]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
